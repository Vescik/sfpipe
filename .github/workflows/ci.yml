# CI samego narzędzia: typy, testy i build na każdej zmianie.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows: zespół pracuje lokalnie na Windows, a CLI uruchamia tam git i sf przez .cmd.
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI startuje
        run: node packages/cli/dist/cli.js --version

  kit:
    name: zestaw kit/ (skrypty, sgd, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: sf CLI i sfdx-git-delta (te same wersje co w kit/.github/workflows/sf-deploy.yml)
        run: |
          npm install --global "@salesforce/cli@2.159.7"
          echo y | sf plugins install "sfdx-git-delta@6.45.1"
      - name: Testy skryptów (z prawdziwym sfdx-git-delta)
        env:
          RUN_SGD_TESTS: '1'
        run: python3 -m unittest discover -s kit/tests -v
      - name: actionlint (składnia workflowów i shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color kit/.github/workflows/*.yml .github/workflows/*.yml
